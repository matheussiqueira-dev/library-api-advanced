name: CI - Build & Test

on:
  # Execução manual (Actions -> "CI - Build & Test" -> Run workflow). Política de automação mínima da conta
  # (auditoria FinOps de 06/11/2026): sem push, pull_request ou agendamento automáticos, para não
  # consumir a franquia de minutos. Rode antes de divulgar ou publicar uma mudança relevante.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: ".python-version"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint and format check
      run: |
        ruff check .
        ruff format --check .

    - name: Typecheck
      run: |
        mypy app

    - name: Run Tests
      run: |
        pytest --cov=app --cov-fail-under=90

    - name: Audit runtime dependencies
      run: |
        pip install pip-audit==2.10.1
        pip-audit -r requirements.txt
