target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[lint.flake8-bugbear]
# FastAPI declares dependencies and parameters through calls in default arguments.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
]
